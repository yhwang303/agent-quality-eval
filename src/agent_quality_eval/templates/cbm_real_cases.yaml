    限定只修改当前项目的评估部分，保留现有上方展示区并替换下方打分方案 决定先调研“letsgoagenteval”项目中的第三版评估框架，再据此重构当前项目的评估模块。重构目标是保留现有评估界面中的部分展示内容，但将下方主观的单一质量分替换为基于第三版标准的更全面评估方案，并补充更细粒度断言，同时把自动化评测流水线、甲乙对比测试和回归检测纳入设计范围。修改范围被限定在评估模块，不涉及其他部分。
    用户要求查看磁盘中的“letsgoagenteval”项目，并重点参考其中的第三版评估框架。 用户明确指出当前项目现有评估内容过于主观，缺乏实际评测意义，且对任意项目或任意轨迹都可能给出相似评价。
    用户要求保留现有界面中图二所示的上部内容，不保留当前下方以单一质量分为核心的评分方案。 用户要求新的评估方案基于第三版标准，补充更细致的断言设计。 用户要求新的评估设计同时考虑自动化评测流水线、甲乙对比测试、回归检测等能力。
