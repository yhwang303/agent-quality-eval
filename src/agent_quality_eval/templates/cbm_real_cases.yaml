name: cbm-real-dev-cases-v3
providers:
- type: mock
  name: replace-with-agent-under-test
  default_response: This is a placeholder provider. Replace it with a real agent provider
    before using this dataset for release gating.
settings:
  num_trials: 1
  pass_threshold: 0.8
  output_dir: ./results
dataset:
  name: cbm-real-dev-cases
  version: v1
  description: Redacted real development/debugging cases extracted from CodeBuddy
    Memory.
defaultAssertions:
- type: non-empty
- type: no-error
- type: no-pii
- type: min-length
  value: 80
tests:
- id: cbm-bugfix-001
  question: 'Analyze this redacted real development case and produce a release-quality
    answer. Your answer must explain the user problem, likely root cause, fix or evaluation
    approach, validation evidence, and remaining regression risk.


    Case brief: 用户希望把当前工作树中的精简版 Codex 集成内容提交到远端新分支，并确保它基于已修复缺陷的主干且不包含 import 和混合检索功能。
    检查了当前变更与暂存内容，搜索并确认是否仍包含导入、混合检索、向量库等相关能力，同时核对了目标分支与基线分支的提交关系。 已将当前内容提交为一个新提交，并将远端目标分支更新为仅基于缺陷修复主干加这一个
    Codex 适配提交；同时确认未包含 import、embedding、混合检索等不需要功能。'
  description: Real CBM case from agent-memory / bugfix.
  expected_answer: 'Must identify the concrete problem or user request. Must explain
    the investigated evidence or likely root cause. Must describe the completed fix,
    evaluation approach, or why it remains blocked. Must mention validation or regression
    checks. Must preserve privacy and not invent unobserved evidence. Case evidence:
    已将当前内容提交为一个新提交，并将远端目标分支更新为仅基于缺陷修复主干加这一个 Codex 适配提交；同时确认未包含 import、embedding、混合检索等不需要功能。
    建议让相关同事基于该远端分支进行验收；如需长期保留，可补充分支说明或发起合并请求以固定用途。 将内存恢复钩子改回 PascalCase 并保留 transcript
    常驻恢复 调整 Codex 应用的 hook 命名与 transcript watcher 恢复策略，重新打包并推送远端分支 这次把内存恢复相关 hook
    统一改回 PascalCase 命名，并继续保留 transcript fallback 的常驻恢复方案。与此同时，将原先更激进的 watcher 节奏从
    3 秒调整为 6 秒扫描、5 秒静默，以换取更缓和的恢复行为，预期恢复延迟为 5 到 11 秒。实现范围被明确限制，没有加入 import、hybrid MCP
    或 [REDACTED_PATH] 目录内容。修改后重新打包生成了 2.0.30 安装包，验证结果显示 Codex 相关测试 30 项全部通过，且安装包内代码也已确认是
    PascalCase 与 [REDACTED_PATH] 的配置。最后，变更已推送到 live 分支，旧的全功能分支仍保留且未被覆盖。 已将 hook 写法改回
    PascalCase：UserPromptSubmit、SessionStart、PostToolUse、PreToolUse、PreCompact、Stop、SessionEnd。
    保留 transcript fallback 常驻恢复机制。 transcript watcher 从 3 秒调整为 6 秒扫描、5 秒静默。 预期恢复延迟约为
    5 到 11 秒。 未加入 import、hybrid MCP、[REDACTED_PATH] 目录相关内容。 已生成安装包：[REDACTED_ARTIFACT]。
    Codex 相关测试结果为 [REDACTED_PATH] 通过。 安装包内代码已确认采用 PascalCase，且 watcher...'
